# Place at /etc/nginx/sites-available/alumni-portal, symlink into sites-enabled, then
# `certbot --nginx -d alumni.example.edu` to provision TLS (or point ssl_certificate/key at
# your own certs and drop the certbot-managed lines).
server {
    listen 80;
    server_name alumni.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name alumni.example.edu;

    ssl_certificate     /etc/letsencrypt/live/alumni.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumni.example.edu/privkey.pem;

    client_max_body_size 10m; # profile/job/event image uploads

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
